
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dce8f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="metals-icon.png">
<title>Metals</title>

<style>
:root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #244563;
    background: #dce8f3;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-size: 13px;
}

header, main {
    max-width: 850px;
    margin: auto;
    padding: 5px 6px;
}

header {
    padding-top: calc(6px + env(safe-area-inset-top));
}

h1 {
    font-size: 20px;
    margin: 0;
}

h2, h3 {
    font-size: 13px;
    margin: 6px 0 3px;
}

button, input {
    font: inherit;
    border: 1px solid #94b1cc;
    border-radius: 4px;
    padding: 6px 8px;
    background: #b6cde2;
    color: #244563;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

button.active {
    background: #d9bd79;
    border-color: #b69a53;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 4px;
    margin: 5px 0;
}

nav button {
    flex: 1;
}

.actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
}

small, .muted {
    color: #456782;
    font-size: 11px;
}

.panel {
    background: #f5f9fd;
    border: 1px solid #a6bfd5;
    border-radius: 3px;
    padding: 4px;
    margin: 4px 0;
}

.line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    margin: 2px 0;
}

.big {
    font-size: 21px;
    color: #244563;
    font-weight: bold;
}

.total-value {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px;
    background: #f5f9fd;
    border: 1px solid #a6bfd5;
    margin-bottom: 4px;
}

.spot-strip {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 6px;
    background: #ffffff;
    border: 1px solid #a6bfd5;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 600;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
}

td, th {
    padding: 3px 4px;
    line-height: 1.2;
    border: 1px solid #afc5da;
    text-align: right;
    white-space: nowrap;
}

th {
    background: #a9c4de;
    font-weight: 600;
}

td:first-child, th:first-child {
    text-align: left;
}

tbody tr:nth-child(even) {
    background: #dce8f3;
}

tbody tr:nth-child(odd) {
    background: #ffffff;
}

.total-row td {
    background: #a9c4de;
    font-weight: bold;
}

.group-row td {
    background: #a9c4de;
    font-weight: bold;
    text-align: left;
    padding: 3px 4px;
}

.gold {
    color: #80601d;
}

.silver {
    color: #526b82;
}

.good {
    color: #21643b;
    font-weight: 700;
}

.acceptable {
    color: #805a19;
    font-weight: 600;
}

progress {
    width: 100%;
    height: 5px;
    accent-color: #b69a53;
    display: block;
    margin-top: 2px;
}

.goal-progress {
    min-width: 65px;
}

.scroll {
    overflow-x: auto;
}

input {
    width: 100%;
    background: #ffffff;
    margin-bottom: 4px;
}

#search {
    font-size: 16px;
    padding: 5px 7px;
}

.filters {
    display: flex;
    gap: 3px;
    margin-bottom: 4px;
}

.filters button {
    flex: 1;
    padding: 5px;
}

.guide-table {
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
}

.guide-table th {
    position: sticky;
    top: 0;
    z-index: 2;
}

.guide-table th,
.guide-table td {
    border-right: 1px solid #afc5da;
    border-bottom: 1px solid #afc5da;
    border-top: 0;
    border-left: 0;
}

.guide-table th:first-child,
.guide-table td:first-child {
    border-left: 1px solid #afc5da;
}

.guide-table thead th {
    border-top: 1px solid #afc5da;
}

.guide-table th:first-child {
    width: 43%;
}

.guide-table th:not(:first-child) {
    width: 19%;
}

.guide-table td:first-child {
    white-space: normal;
    overflow-wrap: anywhere;
}

.guide-table td {
    padding: 3px;
    line-height: 1.15;
}

#productCount {
    display: block;
    margin: 2px 0 5px;
}

[hidden] {
    display: none !important;
}

#status {
    overflow-wrap: anywhere;
    display: block;
    margin: 2px 0;
    font-size: 10px;
}

footer {
    padding: 6px 0;
    font-size: 10px;
    color: #456782;
}

footer button {
    font-size: 11px;
    padding: 4px 7px;
}

@media (max-width: 480px) {
    table {
        font-size: 11px;
    }

    td, th {
        padding: 3px 2px;
    }

    .activity-table {
        font-size: 10px;
    }

    .activity-table td,
    .activity-table th {
        padding: 3px 2px;
    }

    .guide-table {
        font-size: 11px;
    }

    .guide-table td,
    .guide-table th {
        padding: 3px 2px;
    }

    .big {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <div class="actions">
        <h1>Metals</h1>
        <button id="login">Sign in to Microsoft</button>
        <button id="refresh" disabled>Refresh</button>
    </div>

    <small id="status" role="status">Connecting...</small>

    <nav>
        <button data-tab="holdings">Dashboard</button>
        <button data-tab="guide" class="active">Buying Guide</button>
    </nav>
</header>

<main>

    <section id="holdings" hidden>
        <p>Sign in to load your workbook.</p>
    </section>

    <section id="guide">

        <div id="guideSpot" class="spot-strip">
            <span class="gold">Gold: —</span>
            <span class="silver">Silver: —</span>
        </div>

        <input id="search"
               type="search"
               placeholder="Find coin or product..."
               aria-label="Search buying guide"
               autocomplete="off">

        <div class="filters">
            <button data-metal="All" class="active">All</button>
            <button data-metal="Gold">Gold</button>
            <button data-metal="Silver">Silver</button>
        </div>

        <div id="products">
            <p>Sign in to load your buying guide.</p>
        </div>

        <small id="productCount"></small>

        <section id="activity">
        </section>

    </section>

    <footer>
        <div class="actions">
            <span>Read-only · Prices in USD · Saved Excel values</span>
            <button id="logout" hidden>Sign out</button>
        </div>
    </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.1/lib/msal-browser.min.js"></script>
<script src="app.js?v=5"></script>

</body>
</html>
