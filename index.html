
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dce8f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="metals-icon.png">
<title>Metals</title>

<style>
:root {
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #244563;
    background: #dce8f3;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-size: 13px;
}

header, main {
    max-width: 850px;
    margin: auto;
    padding: 6px 8px;
}

header {
    padding-top: calc(8px + env(safe-area-inset-top));
}

h1 {
    font-size: 21px;
    margin: 0;
}

h2, h3 {
    font-size: 14px;
    margin: 7px 0 3px;
}

button, input {
    font: inherit;
    border: 1px solid #94b1cc;
    border-radius: 4px;
    padding: 6px 9px;
    background: #b6cde2;
    color: #244563;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

button.active {
    background: #d9bd79;
    border-color: #b69a53;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 4px;
    margin: 6px 0;
}

nav button {
    flex: 1;
}

.actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
}

small, .muted {
    color: #456782;
    font-size: 11px;
}

.panel {
    background: #f5f9fd;
    border: 1px solid #a6bfd5;
    border-radius: 3px;
    padding: 4px;
    margin: 4px 0;
}

.line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    margin: 2px 0;
}

.big {
    font-size: 22px;
    color: #244563;
    font-weight: bold;
}

.total-value {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 6px;
    background: #f5f9fd;
    border: 1px solid #a6bfd5;
    margin-bottom: 5px;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 5px;
}

td, th {
    padding: 3px 4px;
    line-height: 1.25;
    border: 1px solid #afc5da;
    text-align: right;
    white-space: nowrap;
}

th {
    background: #a9c4de;
    font-weight: 600;
}

td:first-child, th:first-child {
    text-align: left;
}

tbody tr:nth-child(even) {
    background: #dce8f3;
}

tbody tr:nth-child(odd) {
    background: #ffffff;
}

.total-row td {
    background: #a9c4de;
    font-weight: bold;
}

.group-row td {
    background: #a9c4de;
    font-weight: bold;
    text-align: left;
}

.gold {
    color: #80601d;
}

.silver {
    color: #526b82;
}

.good {
    color: #24643d;
    font-weight: 600;
}

progress {
    width: 100%;
    height: 5px;
    accent-color: #b69a53;
    display: block;
    margin-top: 2px;
}

.goal-progress {
    min-width: 65px;
}

.scroll {
    overflow-x: auto;
}

input {
    width: 100%;
    background: #f5f9fd;
    margin-bottom: 5px;
}

[hidden] {
    display: none !important;
}

#status {
    overflow-wrap: anywhere;
    display: block;
    margin: 3px 0;
    font-size: 10px;
}

footer {
    padding: 6px 0;
    font-size: 10px;
    color: #456782;
}

footer button {
    font-size: 11px;
    padding: 4px 7px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}

.grid strong {
    display: block;
}

@media (max-width: 480px) {
    table {
        font-size: 11px;
    }

    td, th {
        padding: 3px 2px;
    }

    .activity-table {
        font-size: 10px;
    }

    .activity-table td,
    .activity-table th {
        padding: 3px 2px;
    }

    .guide-table td:first-child {
        white-space: normal;
    }

    .big {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="actions">
        <h1>Metals</h1>
        <button id="login">Sign in to Microsoft</button>
        <button id="refresh" disabled>Refresh</button>
    </div>

    <small id="status" role="status">Connecting...</small>

    <nav>
        <button data-tab="holdings" class="active">Dashboard</button>
        <button data-tab="guide">Buying Guide</button>
    </nav>
</header>

<main>

    <section id="holdings">
        <p>Sign in to load your workbook.</p>
    </section>

    <section id="activity">
    </section>

    <section id="guide" hidden>
        <input id="search"
               placeholder="Search buying guide"
               aria-label="Search buying guide">
        <div id="products"></div>
    </section>

    <footer>
        <div class="actions">
            <span>Read-only · Saved Excel values</span>
            <button id="logout" hidden>Sign out</button>
        </div>
    </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.1/lib/msal-browser.min.js"></script>
<script src="app.js?v=4"></script>

</body>
</html>
